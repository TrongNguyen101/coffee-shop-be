server:
  port: 8081

spring:
  config:
    activate:
      on-profile: dev

  datasource:
    # Local development connection
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:coffee-shop-db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres@1234}
    driver-class-name: org.postgresql.Driver

  flyway:
    # Ensures Flyway runs migrations on application startup
    enabled: true
    # Tells Flyway where your migration SQL files live
    locations: classpath:db/migration

  thymeleaf:
    check-template-location: false

mybatis:
  # Points to the XML mapper directory we just set up
  mapper-locations: classpath:mapper/*.xml
  type-handlers-package: coffee.api.config
  # Allows using short aliases (like resultType="User") in your XML files
  configuration:
    # Converts snake_case columns (e.g., first_name) to camelCase fields (e.g., firstName)
    map-underscore-to-camel-case: true
    jdbc-type-for-null: OTHER
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  cors:
    allowed-origins:
      - "http://localhost:5173"
      - "http://localhost:3000"
    allowed-methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "PATCH"
      - "OPTIONS"
    allowed-headers:
      - "*"
    allow-credentials: true

logging:
  level:
    root: info
    org.hibernate.SQL: debug
    org.hibernate.orm.results: trace # Logs the actual data binding values