services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coffee-shop-api-prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Supabase Database
      DB_HOST: ${DB_HOST:aws-0-ap-south-1.pooler.supabase.com}
      DB_PORT: ${DB_PORT:5432}
      DB_NAME: ${DB_NAME:postgres}
      DB_USERNAME: ${DB_USERNAME:postgres.ldamaltfehzopoqfywpa}
      DB_PASSWORD: ${DB_PASSWORD}
      # Supabase Storage (S3)
      SUPABASE_BUCKET_NAME: ${SUPABASE_BUCKET_NAME:drinks}
      SUPABASE_REGION: ${SUPABASE_REGION:ap-south-1}
      SUPABASE_ENDPOINT: ${SUPABASE_ENDPOINT:https://aws-0-ap-south-1.pooler.supabase.com}
      SUPABASE_ACCESS_KEY: ${SUPABASE_ACCESS_KEY}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
    ports:
      - "8080:8080"
    networks:
      - coffee-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

networks:
  coffee-network:
    driver: bridge
