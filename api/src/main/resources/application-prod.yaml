spring:
  config:
    activate:
      on-profile: prod

  datasource:
    # Supabase connection
    url: jdbc:postgresql://${DB_HOST:aws-0-ap-south-1.pooler.supabase.com}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USERNAME:postgres.ldamaltfehzopoqfywpa}
    password: ${DB_PASSWORD:postgres@1234}
    driver-class-name: org.postgresql.Driver

  flyway:
    # Ensures Flyway runs migrations on application startup
    enabled: true
    # Tells Flyway where your migration SQL files live
    locations: classpath:db/migration

mybatis:
  # Points to the XML mapper directory we just set up
  mapper-locations: classpath:mapper/*.xml
  type-handlers-package: coffee.api.config
  # Allows using short aliases (like resultType="User") in your XML files
  configuration:
    # Converts snake_case columns (e.g., first_name) to camelCase fields (e.g., firstName)
    map-underscore-to-camel-case: true
    jdbc-type-for-null: OTHER
    # Directs MyBatis to route its internal statements into your slf4j/logback stream
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  cors:
    # Use patterns instead of wildcard when allowCredentials is true
    # Matches: https://domain.com, https://sub.domain.com, http://localhost:*, etc.
    allowed-origin-patterns:
      - "https://coffee-shop-fe.onrender.com"
    allowed-methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "PATCH"
      - "OPTIONS"
    allowed-headers:
      - "*"
    allow-credentials: true

storage:
  supabase:
    enabled: true
    bucket-name: ${SUPABASE_BUCKET_NAME:drinks}
    # MUST match the region shown on Storage -> S3 Connection page (may differ from DB region)
    region: ${SUPABASE_REGION:ap-south-1}
    # S3-compatible endpoint: https://<project_ref>.storage.supabase.co/storage/v1/s3
    endpoint: ${SUPABASE_ENDPOINT:https://ldamaltfehzopoqfywpa.storage.supabase.co/storage/v1/s3}
    # Public URL prefix for serving files: https://<project_ref>.supabase.co/storage/v1/object/public
    public-url: ${SUPABASE_PUBLIC_URL:https://ldamaltfehzopoqfywpa.supabase.co/storage/v1/object/public}
    access-key: ${SUPABASE_ACCESS_KEY:4c9a677a3a06e3474c7d905bdb7c6c08}
    secret-key: ${SUPABASE_SECRET_KEY:496e037276080d91da3f50eeb7e14c16880eb065b4d0a90d6734a999ec6afe63}

logging:
  level:
    root: warn
    # Enable logging for API calls
    coffee.api: info
    # Log HTTP requests and responses
    org.springframework.web: info
    org.springframework.security: info
    # Show SQL queries in production for debugging
    org.hibernate.SQL: info
    org.hibernate.orm.results: info
    org.mybatis: info