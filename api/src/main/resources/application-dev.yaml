server:
  port: 8081

spring:
  config:
    activate:
      on-profile: dev

  datasource:
    # Supabase connection
    url: jdbc:postgresql://${DB_HOST:aws-0-ap-southeast-1.pooler.supabase.com}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USERNAME:postgres.xauxrvolraonrrxavkrt}
    password: ${DB_PASSWORD:postgres@1234}
    driver-class-name: org.postgresql.Driver

  flyway:
    # Ensures Flyway runs migrations on application startup
    enabled: true
    # Tells Flyway where your migration SQL files live
    locations: classpath:db/migration

  thymeleaf:
    check-template-location: false

mybatis:
  # Points to the XML mapper directory we just set up
  mapper-locations: classpath:mapper/*.xml
  type-handlers-package: coffee.api.config
  # Allows using short aliases (like resultType="User") in your XML files
  configuration:
    # Converts snake_case columns (e.g., first_name) to camelCase fields (e.g., firstName)
    map-underscore-to-camel-case: true
    jdbc-type-for-null: OTHER
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  cors:
    allowed-origins:
      - "http://localhost:5173"
      - "http://localhost:3000"
    allowed-methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "PATCH"
      - "OPTIONS"
    allowed-headers:
      - "*"
    allow-credentials: true

storage:
  supabase:
    enabled: true
    bucket-name: ${SUPABASE_BUCKET_NAME:drink-images}
    region: ${SUPABASE_REGION:ap-south-1}
    endpoint: ${SUPABASE_ENDPOINT:https://xauxrvolraonrrxavkrt.storage.supabase.co/storage/v1/s3}
    access-key: ${SUPABASE_ACCESS_KEY:afd8194c1a7b2477957e13f7c2d198f4}
    secret-key: ${SUPABASE_SECRET_KEY:3df2c0f86e6c59340235f67df35c4913e63360e97b0a4f951ccb17991936930a}

logging:
  level:
    root: info
    org.hibernate.SQL: debug
    org.hibernate.orm.results: trace # Logs the actual data binding values